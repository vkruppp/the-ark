<style>
body{background:var(--bg)}
.stage{min-height:100svh;padding:110px 0 80px}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
@media(max-width:900px){.intro{grid-template-columns:1fr}}
.intro img{border-radius:20px;aspect-ratio:4/3;object-fit:cover;width:100%}
.intro h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(48px,7vw,92px);line-height:.95}
.intro ul{list-style:none;margin:28px 0 34px}
.intro li{padding:10px 0;border-bottom:1px solid var(--line);color:var(--mu)}
.intro li b{color:var(--tx);font-weight:500;margin-right:8px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
.prog{position:sticky;top:72px;z-index:20;background:rgba(14,20,23,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 0 10px;margin-bottom:10px}
.prog .t{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:8px;letter-spacing:.5px}
.prog .tr{height:3px;background:var(--line);border-radius:2px}
.prog .fl{height:100%;background:var(--br);border-radius:2px;transition:width .5s}
.steps{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:none;background:none;border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.steps button.on{border-color:var(--br);color:var(--tx)}
.steps button.done{color:var(--br)}
.sech{display:flex;align-items:flex-end;gap:22px;margin:26px 0 22px}
.sech .n{font-family:'Cormorant Garamond',Georgia,serif;font-size:90px;line-height:.8;color:var(--line)}
.sech h2{margin:0}
.sech p{color:var(--mu)}
.fade{animation:fd .6s cubic-bezier(.2,.7,.2,1)}
@keyframes fd{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q{background:var(--card);border-radius:18px;padding:24px 26px;margin-bottom:14px}
.q .ql{font-size:18px;font-weight:500;margin-bottom:4px}
.q .qh{font-size:13px;color:var(--mu);margin-bottom:12px}
.ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ch button{text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px 14px;font:inherit;font-size:15px;cursor:pointer;line-height:1.3;transition:border-color .2s,background .2s,transform .15s}
.ch button:hover{border-color:#4A5A61}
.ch button:active{transform:scale(.98)}
.ch button.on{border-color:var(--br);background:var(--sel)}
.ch button.on:before{content:"✓ ";color:var(--br)}
input[type=text],input[type=email],input[type=number],textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:15px}
.q input[type=text].oth{margin-top:10px;background:transparent;border-style:dashed}
textarea{min-height:100px;resize:vertical}
.navb{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
/* result */
.res{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.res{grid-template-columns:1fr}}
.card .tot,.tot{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(64px,9vw,110px);line-height:.9;color:var(--br)}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.line b{font-weight:500;text-align:right}
.bar{font-size:13px;color:var(--mu);margin-top:10px}
.bar .t{display:flex;justify-content:space-between;margin-bottom:4px}
.bar .tr{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar .fl{height:100%;background:var(--br);transition:width .8s}
.note{font-size:13px;color:var(--mu);margin-top:14px}
.flag{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;border:1px solid var(--line)}
.flag.warn{border-color:var(--em);color:var(--em)}
.flag.ok{border-color:var(--br);color:var(--br2)}
details.adj{background:var(--card);border-radius:18px;margin-top:20px}
details.adj>summary{cursor:pointer;padding:22px 26px;font-size:18px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.adj>summary::-webkit-details-marker{display:none}
details.adj>summary:after{content:"+";color:var(--br);font-size:24px;line-height:1}
details.adj[open]>summary:after{content:"–"}
.adjin{padding:0 26px 26px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.f{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.rng{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--br)}
.rng output{min-width:70px;text-align:right;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--br);color:var(--tx);background:var(--sel)}
.seg button:disabled{opacity:.35;cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.opt input{margin-top:3px;accent-color:var(--br)}
.opt .c{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap;padding-left:8px}
.opt.dis{opacity:.35;cursor:default}
.gh{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;margin:8px 0 10px}
.send{background:var(--card);border-radius:18px;padding:28px;margin-top:20px}
.msg{font-size:14px;margin-top:12px;min-height:20px;color:var(--br2)}
.ans .k{font-size:12px;color:var(--mu)}
.ans div{margin-bottom:10px}
</style>

 h+=`<div class="fade"><div class="sech"><span class="n">${String(cur+1).padStart(2,"0")}</span><div><h2>${tobj(s)}</h2><p>${tx(s.hr,s.he)}</p></div></div>`;

  else if(ty=="t")h+=`<input type="text" data-x="${id}" value="${esc(v.t||"")}" style="margin-top:8px">`;else h+=`<textarea data-x="${id}" style="margin-top:8px">${esc(v.t||"")}</textarea>`;h+=`</div>`});

  A[id].c=q[1]=="s"?(A[id].c.includes(i)?[]:[i]):(A[id].c.includes(i)?A[id].c.filter(x=>x!=i):[...A[id].c,i]);
  b.parentNode.querySelectorAll("button").forEach(x=>x.className=A[id].c.includes(+x.dataset.i)?"on":"");adjusted=false;save();upd()});
 $("app").querySelectorAll("[data-o]").forEach(e=>e.oninput=()=>{const id=e.dataset.o;A[id]=A[id]||{};A[id].o=e.value;save();upd()});

function upd(){const t=TT(),n=allQ.filter(isAns).length;const sp=$("app").querySelector(".prog .t span:last-child");if(sp)sp.textContent=`${n} / ${allQ.length} ${t.answered}`;
 $("app").querySelectorAll(".steps button").forEach((b,i)=>{if(i<S.length)b.classList.toggle("done",S[i].q.every(isAns))})}
function intro(t){const n=allQ.filter(isAns).length;

function ansText(q){const [id,ty,,,oR,oE]=q,v=A[id];if(!isAns(q))return null;if(ty=="t"||ty=="a")return v.t;const op=tarr(oR,oE);return [...(v.c||[]).map(i=>op[i]),v.o].filter(Boolean).join(", ")}

  ${FORM_EMAIL?`<div class="row" style="margin-top:18px"><div><label class="f">${tx("Имя или кодовое имя","Name or code name")}</label><input type="text" id="s_name" value="${esc((A.name&&A.name.t)||"")}"></div><div><label class="f">${tx("Контакт","Contact")}</label><input type="text" id="s_contact" value="${esc((A.contact&&A.contact.t)||"")}"></div></div>`:""}

 <details class="adj"><summary>${t.answers}</summary><div class="adjin ans">${S.map((s,i)=>`<p class="gh">${tobj(s)} <button class="btn ghost" data-e="${i}" style="padding:4px 12px;font-size:12px;margin-left:8px">${t.edit}</button></p>`+s.q.map(q=>`<div><p class="k">${tx(q[2],q[3])}</p><p>${ansText(q)?esc(ansText(q)):`<span class="mu">${t.empty}</span>`}</p></div>`).join("")).join("")}</div></details>
 <div class="navb"><button class="btn ghost" id="bk">← ${t.back}</button><button class="btn ghost" id="rs">${t.restart}</button></div></div>`;
 buildAdj(t);calc(t);

 if($("s_send"))$("s_send").onclick=async()=>{const b=$("s_send");b.disabled=true;$("s_msg").textContent=t.sending;
  A.name={t:$("s_name").value};A.contact={t:$("s_contact").value};save();
  try{const r=await fetch("https://formsubmit.co/ajax/"+FORM_EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"The Ark: "+(A.name.t||"new application"),_template:"box",name:A.name.t,contact:A.contact.t,message:plain(t)})});
   if(!r.ok)throw 0;$("s_msg").textContent=t.sent}catch(e){$("s_msg").textContent=t.sendFail;b.disabled=false}};

function buildAdj(t){const loc=LOCS.find(l=>l.k==st.loc),coastOK=loc.coast&&st.ter=="coast",K=loc.m*(TER.find(x=>x.k==st.ter)||TER[0]).m;
 const rng=(k,lab,min,max,step,suf)=>`<div><label class="f">${lab}</label><div class="rng"><input type="range" data-r="${k}" min="${min}" max="${max}" step="${step}" value="${st[k]}"><output id="o_${k}">${st[k]}${suf||""}</output></div></div>`;
 let h=`<div class="row"><div><label class="f">${t.country}</label><select id="a_loc">${LOCS.map(l=>`<option value="${l.k}" ${l.k==st.loc?"selected":""}>${tobj(l)}</option>`).join("")}</select></div><div><label class="f">${t.ha}</label><input type="number" id="a_ha" min="2" max="1000" value="${st.ha}"></div></div>
